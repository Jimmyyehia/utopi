name: Utopi CI / CD Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Lint, Test & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Seed Local SQLite Test Database
        run: npx tsx prisma/seed.ts

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Core Test Suite (60 Tests)
        run: npx tsx test-suite.ts

      - name: Validate Next.js Production Build
        run: npm run build
        env:
          NEXTAUTH_SECRET: ci-test-secret-min-32-chars-long-abcdef
          NEXTAUTH_URL: http://localhost:3000
          DATABASE_URL: file:./dev.db
